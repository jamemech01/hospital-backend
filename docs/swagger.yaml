openapi: 3.0.3

info:
  title: Hospital Backend API
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /staff/create:
    post:
      summary: Create staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffRequest"
      responses:
        "201":
          description: Created
        "400":
          description: Bad request

  /staff/login:
    post:
      summary: Staff login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffRequest"
      responses:
        "200":
          description: Login successful
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

  /patient/search:
    get:
      summary: Search patients
      security:
        - BearerAuth: []
      parameters:
        - name: national_id
          in: query
          schema:
            type: string
        - name: passport_id
          in: query
          schema:
            type: string
        - name: first_name
          in: query
          schema:
            type: string
        - name: middle_name
          in: query
          schema:
            type: string
        - name: last_name
          in: query
          schema:
            type: string
        - name: date_of_birth
          in: query
          schema:
            type: string
        - name: phone_number
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
        - name: hospital_name
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Success
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "500":
          description: Internal server error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StaffRequest:
      type: object
      required:
        - username
        - password
        - hospital
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        hospital:
          type: string